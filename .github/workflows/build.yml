          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          val Ink = Color(0xFF12101C); val Panel = Color(0xFF1B1828); val Amber = Color(0xFFF2B45A)
          val Violet = Color(0xFF9A89FF); val Muted = Color(0xFFA49FBD)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Amber, secondary = Violet, background = Ink, surface = Panel)) {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              Surface(Modifier.fillMaxSize(), color = Ink) { App() }
