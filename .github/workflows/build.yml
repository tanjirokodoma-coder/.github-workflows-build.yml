                      }
                  }
              }
          }

          fun fmtTime(ms: Long): String { val s = ms / 1000; return "%d:%02d".format(s / 60, s % 60) }
          fun fmtSize(b: Long) = if (b >= 1L shl 30) "%.2f GB".format(b / 1073741824.0) else "%.1f MB".format(b / 1048576.0)

          @Composable fun App() {
              val ctx = LocalContext.current
              var projects by remember { mutableStateOf(Store.load(ctx)) }
              var open by remember { mutableStateOf<Project?>(null) }
              var busy by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf<String?>(null) }
              val scope = rememberCoroutineScope()
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) scope.launch {
                      busy = true; error = null
                      try {
                          val p = withContext(Dispatchers.IO) { Probe.read(ctx, uri) }
                          projects = listOf(p) + projects; Store.save(ctx, projects); open = p
                      } catch (e: Exception) { error = "طھط¹ط°ط±طھ ظ‚ط±ط§ط،ط© ط§ظ„ظ…ظ„ظپ: ${e.message}" }
                      busy = false
                  }
              }
              BackHandler(open != null) { open = null }
              val p = open
              if (p != null) ProjectScreen(p) { open = null }
              else Column(Modifier.fillMaxSize().systemBarsPadding().padding(18.dp)) {
                  Text("NEXCUT-AI", style = MaterialTheme.typography.headlineMedium, color = Amber)
                  Text("ظ…ظ† ط§ظ„ظپظٹط¯ظٹظˆ ط§ظ„ط®ط§ظ… ط¥ظ„ظ‰ ظ…ط´ط±ظˆط¹ ظ…ظ†ط¸ظ…", color = Muted)
                  Spacer(Modifier.height(18.dp))
                  Button({ picker.launch(arrayOf("video/*")) }, Modifier.fillMaxWidth().height(56.dp), enabled = !busy) {
                      Text(if (busy) "ط¬ط§ط±ظچ ظ‚ط±ط§ط،ط© ط§ظ„ظ…ظ„ظپâ€¦" else "ظ…ط´ط±ظˆط¹ ط¬ط¯ظٹط¯: ط§ط³طھظٹط±ط§ط¯ ظپظٹط¯ظٹظˆ")
                  }
                  error?.let { Text(it, color = Color(0xFFFF8A80), modifier = Modifier.padding(top = 10.dp)) }
                  Spacer(Modifier.height(18.dp))
                  Text("ط§ظ„ظ…ط´ط§ط±ظٹط¹ ط§ظ„ط£ط®ظٹط±ط©", style = MaterialTheme.typography.titleMedium)
                  if (projects.isEmpty()) Text("ظ„ط§ طھظˆط¬ط¯ ظ…ط´ط§ط±ظٹط¹ ط¨ط¹ط¯. ط§ط³طھظˆط±ط¯ ظپظٹط¯ظٹظˆ ظ„طھط¨ط¯ط£.", color = Muted, modifier = Modifier.padding(top = 8.dp))
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(top = 8.dp)) {
                      items(projects) { it ->
                          Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp)).background(Panel).clickable { open = it }.padding(14.dp)) {
                              Text(it.name, maxLines = 1)
                              Text("${fmtTime(it.durationMs)} آ· ${it.width}أ—${it.height} آ· ${fmtSize(it.sizeBytes)}", color = Muted)
                          }
                      }
                  }
              }
          }

          @Composable fun ProjectScreen(p: Project, onBack: () -> Unit) {
              val ctx = LocalContext.current
              val player = remember { ExoPlayer.Builder(ctx).build().apply { setMediaItem(MediaItem.fromUri(p.uri)); prepare() } }
              DisposableEffect(Unit) { onDispose { player.release() } }
              var frames by remember { mutableStateOf<List<Pair<Long, Bitmap>>>(emptyList()) }
              LaunchedEffect(p.id) { frames = withContext(Dispatchers.IO) { keyframes(ctx, Uri.parse(p.uri), p.durationMs) } }
              Column(Modifier.fillMaxSize().systemBarsPadding().padding(18.dp)) {
                  TextButton(onBack) { Text("ط±ط¬ظˆط¹") }
                  Text(p.name, style = MaterialTheme.typography.titleMedium, maxLines = 1)
                  Text("${fmtTime(p.durationMs)} آ· ${p.width}أ—${p.height} آ· ${fmtSize(p.sizeBytes)}", color = Muted)
                  AndroidView({ PlayerView(it).apply { this.player = player } }, Modifier.fillMaxWidth().height(220.dp).padding(vertical = 10.dp))
                  Text("ظ„ظ‚ط·ط§طھ ظ…ظپطھط§ط­ظٹط©", style = MaterialTheme.typography.titleSmall)
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.padding(vertical = 8.dp)) {
                      items(frames) { (t, b) ->
                          Image(b.asImageBitmap(), null, Modifier.height(64.dp).clip(RoundedCornerShape(8.dp)).clickable { player.seekTo(t) })
                      }
                  }
                  Text("ط­ط§ظ„ط© ط§ظ„ظ…ظٹط²ط§طھ", style = MaterialTheme.typography.titleSmall)
                  listOf("ط§ط³طھظٹط±ط§ط¯ ظˆظ‚ط±ط§ط،ط© ط§ظ„ظ…ظ„ظپطŒ ظ…ط¹ط§ظٹظ†ط©طŒ ظ„ظ‚ط·ط§طھ: ظ…ط­ظ„ظٹطŒ ظ…ظ†ظپظژظ‘ط°",
                      "ط§ظ„طھظپط±ظٹط؛ ط§ظ„طµظˆطھظٹ ظˆط§ظ„طھط±ط¬ظ…ط©: ظ‚ظٹط¯ ط§ظ„طھط·ظˆظٹط±",
                      "طھط­ظ„ظٹظ„ ط§ظ„ظپظٹط¯ظٹظˆ ظˆظƒطھط§ط¨ط© ط§ظ„ط³ظƒط±ط¨طھ: ظ‚ظٹط¯ ط§ظ„طھط·ظˆظٹط±طŒ ظٹط­طھط§ط¬ ط¥ظ†طھط±ظ†طھ ظˆظ…ظپطھط§ط­ API ظˆظ…ظˆط§ظپظ‚طھظƒ ظ‚ط¨ظ„ ط§ظ„ط¥ط±ط³ط§ظ„",
                      "ط§ظ„ظ…ط­ط±ط± ظ…طھط¹ط¯ط¯ ط§ظ„ظ…ط³ط§ط±ط§طھ ظˆط§ظ„طھطµط¯ظٹط±: ظ‚ظٹط¯ ط§ظ„طھط·ظˆظٹط±").forEach { Text("â€¢ $it", color = Muted, modifier = Modifier.padding(top = 4.dp)) }
              }
          }

          fun keyframes(ctx: Context, uri: Uri, durMs: Long): List<Pair<Long, Bitmap>> {
              val r = MediaMetadataRetriever(); val out = ArrayList<Pair<Long, Bitmap>>()
              try {
                  r.setDataSource(ctx, uri)
                  val n = (durMs / 5000).toInt().coerceIn(3, 12)
                  for (i in 0 until n) {
                      val t = durMs * (2 * i + 1) / (2 * n)
                      r.getScaledFrameAtTime(t * 1000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC, 320, 180)?.let { out.add(t to it) }
                  }
              } catch (_: Exception) {} finally { r.release() }
              return out
          }
          EOF_NEX
      - uses: actions/setup-java@v4
