name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_NEX'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "NEXCUT-AI"
          include(":app")
          EOF_NEX
          cat > build.gradle.kts <<'EOF_NEX'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_NEX
          cat > gradle.properties <<'EOF_NEX'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_NEX
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_NEX'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "ai.nexcut"
              compileSdk = 34
              defaultConfig { applicationId = "ai.nexcut"; minSdk = 28; targetSdk = 34; versionCode = 1; versionName = "0.1.0" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF_NEX
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_NEX'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NEXCUT-AI" android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_NEX
          mkdir -p app/src/main/java/ai/nexcut
          cat > app/src/main/java/ai/nexcut/Data.kt <<'EOF_NEX'
          package ai.nexcut

          import android.content.Context
          import android.content.Intent
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.provider.OpenableColumns
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          data class Project(val id: Long, val name: String, val uri: String, val durationMs: Long,
                             val width: Int, val height: Int, val sizeBytes: Long)

          object Probe {
              /** Reads metadata only; the video is never loaded into memory. */
              fun read(ctx: Context, uri: Uri): Project {
                  try { ctx.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                  var name = "ظپظٹط¯ظٹظˆ"; var size = 0L
                  ctx.contentResolver.query(uri, null, null, null, null)?.use { c ->
                      if (c.moveToFirst()) {
                          c.getColumnIndex(OpenableColumns.DISPLAY_NAME).takeIf { it >= 0 }?.let { name = c.getString(it) }
                          c.getColumnIndex(OpenableColumns.SIZE).takeIf { it >= 0 }?.let { size = c.getLong(it) }
                      }
                  }
                  val r = MediaMetadataRetriever()
                  try {
                      r.setDataSource(ctx, uri)
                      val dur = r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull()
                      val w = r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull()
                      val h = r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull()
                      if (dur == null || w == null || h == null) throw IllegalStateException("ط§ظ„ظ…ظ„ظپ ظ„ط§ ظٹط­طھظˆظٹ ظ…ط³ط§ط± ظپظٹط¯ظٹظˆ طµط§ظ„ط­ظ‹ط§")
                      return Project(System.currentTimeMillis(), name, uri.toString(), dur, w, h, size)
                  } finally { r.release() }
              }
          }

          object Store {
              private fun file(c: Context) = File(c.filesDir, "projects.json")
              fun load(c: Context): List<Project> = try {
                  val a = JSONArray(file(c).readText())
                  (0 until a.length()).map { val o = a.getJSONObject(it)
                      Project(o.getLong("id"), o.getString("name"), o.getString("uri"), o.getLong("d"),
                          o.getInt("w"), o.getInt("h"), o.getLong("s")) }
              } catch (_: Exception) { emptyList() }
              fun save(c: Context, l: List<Project>) {
                  val a = JSONArray(); l.forEach { a.put(JSONObject().put("id", it.id).put("name", it.name).put("uri", it.uri)
                      .put("d", it.durationMs).put("w", it.width).put("h", it.height).put("s", it.sizeBytes)) }
                  val tmp = File(c.filesDir, "projects.tmp"); tmp.writeText(a.toString()); tmp.renameTo(file(c))
              }
          }
          EOF_NEX
          mkdir -p app/src/main/java/ai/nexcut
          cat > app/src/main/java/ai/nexcut/MainActivity.kt <<'EOF_NEX'
          package ai.nexcut

          import android.content.Context
